[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "buscador-semantico-videojuegos"
version = "0.1.0"
description = "Buscador semántico de videojuegos: catálogo en Markdown, embeddings ONNX precomputados en CI y búsqueda por similitud coseno 100% en el navegador."
readme = "README.md"
requires-python = ">=3.11"

# Dependencias del Paso 1: SOLO lo necesario para validar el catálogo contra el
# schema. En el Paso 2 se suman onnxruntime, numpy y tokenizers para vectorizar.
# Mantener esto mínimo es una decisión consciente: no agregar dependencias que
# no sean centrales (ver sección 11 del brief).
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.18",
]

[project.optional-dependencies]
# Herramientas de desarrollo: linter/formatter (ruff) y framework de tests.
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
]

# El proyecto no expone paquetes Python instalables: son scripts sueltos en
# scripts/. Desactivamos el autodescubrimiento para que `pip install -e .`
# (Paso 6) instale solo las dependencias, sin intentar empaquetar catalog/, etc.
[tool.setuptools]
packages = []
py-modules = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W pycodestyle · F pyflakes · I imports ordenados · UP modernizaciones · B bugbear
select = ["E", "W", "F", "I", "UP", "B"]
