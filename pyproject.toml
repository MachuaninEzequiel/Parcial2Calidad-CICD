[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "buscador-semantico-videojuegos"
version = "0.1.0"
description = "Buscador semántico de videojuegos: catálogo en Markdown, embeddings ONNX precomputados en CI y búsqueda por similitud coseno 100% en el navegador."
readme = "README.md"
requires-python = ">=3.11"

# Dependencias de runtime. Paso 1: pyyaml + jsonschema (validación del catálogo).
# Paso 2: numpy + onnxruntime + tokenizers + huggingface_hub (vectorización ONNX).
# Se mantienen mínimas y centrales (sección 11 del brief): nada superfluo.
#
# REPRODUCIBILIDAD (fix Windows↔Ubuntu): las tres libs que determinan el VALOR
# del embedding van PINEADAS a versión exacta. Con rangos `>=`, cada instalación
# fresca (Windows local, runner de Ubuntu del CI, imagen Docker) resolvía una
# versión distinta de onnxruntime, y la inferencia del modelo int8 NO es idéntica
# entre versiones: onnxruntime 1.25.1 coincide con transformers.js (onnxruntime-web
# del navegador) dentro de 1e-8, pero 1.27.0 diverge ~5e-3 en algunas queries
# (medido en "moba with ranked matches"). Eso rompía el gate de equivalencia y el
# top-k del catálogo. Pineando, el CI, Docker y el dev local calculan EXACTAMENTE
# el mismo embedding. (huggingface_hub solo baja el modelo, no afecta el vector →
# queda con rango.)
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.18",
    "numpy==2.3.3",
    "onnxruntime==1.25.1",
    "tokenizers==0.23.1",
    "huggingface_hub>=0.25",
]

[project.optional-dependencies]
# Herramientas de desarrollo: linter/formatter (ruff) y framework de tests.
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
]

# El proyecto no expone paquetes Python instalables: son scripts sueltos en
# scripts/. Desactivamos el autodescubrimiento para que `pip install -e .`
# (Paso 6) instale solo las dependencias, sin intentar empaquetar catalog/, etc.
[tool.setuptools]
packages = []
py-modules = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W pycodestyle · F pyflakes · I imports ordenados · UP modernizaciones · B bugbear
select = ["E", "W", "F", "I", "UP", "B"]
