spec_summary: 'Empaquetar el entorno de build/dev del proyecto en una imagen Docker
  — la fila ''Entorno del dev con build local'' de la consigna de CI/CD. Un Dockerfile
  (Python 3.13 + Node 22 + las dependencias) que corre el MISMO pipeline que GitHub
  Actions (download_model, ruff, validate_catalog, vectorize, pytest incl. regresión
  semántica, check_site, tests JS incl. el gate de equivalencia Python↔JS) dentro
  de un contenedor, sin instalar nada en la máquina del usuario, garantizando reproducibilidad
  (''en mi máquina anda'' se acaba). Un entrypoint con subcomandos cubre las 3 necesidades:
  `ci` (pipeline completo = paridad con el CI; default), `vectorize` (genera dist/embeddings.json
  en un volumen) y `serve` (sirve el sitio estático local en :8000). El entrypoint
  REUSA los scripts del repo tal cual (no reimplementa lógica). NO incluye el CD/deploy
  a GitHub Pages ni el hosting del modelo en producción: eso queda EXPLÍCITAMENTE
  para el cierre del proyecto. Español rioplatense, didáctico, para la defensa oral.'
