name: CI

# Integración Continua: en cada push y cada Pull Request corremos en el servidor
# los MISMOS gates que el dev corre localmente. Lo que valida tu máquina es
# exactamente lo que valida GitHub Actions.
#
# El job `ci` corre en cada push y PR. El job `deploy` (más abajo) es la Entrega
# Continua (CD): SOLO en push a master y SOLO si `ci` pasó, publica el sitio en
# GitHub Pages. En producción el navegador baja el modelo del HF CDN (Transformers.js).
on:
  push:
  pull_request:

# Si llega un push nuevo al mismo ref mientras corre uno viejo, cancelamos el
# viejo: no tiene sentido gastar minutos en un commit que ya quedó atrás.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# El workflow solo lee el repo (no despliega nada): permisos mínimos.
permissions:
  contents: read

# Token de HuggingFace (secret del repo). Lo levantan huggingface_hub (Python) y
# Transformers.js (Node, gate 8): las descargas pasan a ser AUTENTICADAS, con un
# límite de tasa mucho más alto → evita el 429 de las IPs compartidas del runner.
# Con el modelo ya versionado en models/, el lado Python ni baja; esto cubre el
# gate 8, que sigue tomando el modelo del CDN.
env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias Python (runtime + dev)
        run: pip install -e ".[dev]"

      - name: Instalar dependencias JS (solo para el gate de equivalencia)
        run: npm ci

      # El modelo ONNX (~23 MB) se baja una vez y se cachea entre runs. Cubrimos
      # el cache de huggingface_hub (Python) y el de Transformers.js (Node, .cache/).
      - name: Cache del modelo (HuggingFace / Transformers.js)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            .cache
          key: hf-${{ runner.os }}-${{ hashFiles('scripts/download_model.py') }}

      - name: Bajar modelo + tokenizer
        run: python scripts/download_model.py

      - name: Lint (ruff)
        run: ruff check .

      - name: Validar catálogo contra el schema (SDD Capa A)
        run: python scripts/validate_catalog.py

      - name: Test negativo del validador (un .md malformado debe ser rechazado)
        run: python scripts/validate_catalog.py --expect-fail tests/fixtures/invalid-game.md

      - name: Vectorizar catálogo (genera dist/embeddings.json)
        run: python scripts/vectorize.py

      - name: Tests Python (units del Paso 2 + regresión semántica del Paso 5)
        run: python -m pytest tests/ -q

      - name: Chequeo estructural del sitio
        run: python scripts/check_site.py

      - name: Tests JS puros (search.mjs, sin dependencias)
        run: node --test site/js/search.test.mjs

      - name: Gate de equivalencia Python<->JS (riesgo #1 del ADR-001)
        run: node --test tests/equivalence/embed.equiv.test.mjs

  # ── CD: Entrega Continua a GitHub Pages ──────────────────────────────────
  # Solo en push a `master` y SOLO si el job `ci` pasó (needs: ci). Construye el
  # artefacto del sitio (site/ + dist/embeddings.json) y lo publica en Pages.
  # El modelo NO viaja en el artefacto: el navegador lo baja del HF CDN.
  deploy:
    needs: ci
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias Python (runtime)
        run: pip install -e .

      - name: Cache del modelo (HuggingFace)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('scripts/download_model.py') }}

      - name: Bajar modelo + tokenizer
        run: python scripts/download_model.py

      - name: Vectorizar catálogo (genera dist/embeddings.json)
        run: python scripts/vectorize.py

      # Armamos el artefacto preservando site/ + dist/ para que la ruta relativa
      # ../dist/embeddings.json de app.mjs resuelva en prod igual que en el
      # preview local. Un index.html en la raíz redirige a ./site/.
      - name: Ensamblar el sitio para Pages
        run: |
          mkdir -p _site/dist
          cp -r site _site/site
          cp dist/embeddings.json _site/dist/embeddings.json
          touch _site/.nojekyll
          printf '%s\n' \
            '<!doctype html>' \
            '<html lang="es"><head><meta charset="utf-8">' \
            '<meta http-equiv="refresh" content="0; url=./site/">' \
            '<title>Buscador Semantico de Videojuegos</title></head>' \
            '<body><p>Redirigiendo al <a href="./site/">Buscador Semantico de Videojuegos</a>.</p></body></html>' \
            > _site/index.html

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir el artefacto del sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
